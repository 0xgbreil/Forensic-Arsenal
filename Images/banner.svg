<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Forensic Arsenal – curated DFIR tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1030" cy="160" r="230" fill="url(#glow)"/>

  <!-- hex-like data streams -->
  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#38bdf8" fill-opacity="0.28">
    <text x="700" y="52">4D 5A 90 00 03 00 00 00 04 00</text>
    <text x="760" y="76">FF D8 FF E0 00 10 4A 46 49 46</text>
    <text x="680" y="268">25 50 44 46 2D 31 2E 37 0A 25</text>
    <text x="780" y="292">50 4B 03 04 14 00 06 00 08 00</text>
  </g>

  <!-- magnifier icon -->
  <g transform="translate(1030 150)">
    <circle r="92" fill="#0a1628" fill-opacity="0.6" stroke="url(#accent)" stroke-width="8"/>
    <line x1="66" y1="66" x2="126" y2="126" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
    <g fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9">
      <path d="M-52 10 A52 52 0 0 1 52 10"/>
      <path d="M-36 24 A36 36 0 0 1 36 24"/>
      <path d="M-20 38 A20 20 0 0 1 20 38"/>
      <path d="M-66 -10 A66 66 0 0 1 20 -62" stroke-opacity="0.6"/>
    </g>
    <circle cx="0" cy="38" r="4" fill="#22d3ee"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="2">FORENSIC ARSENAL</text>
    <rect x="82" y="170" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="82" y="214" font-size="25" fill="#cbd5e1">A curated directory of DFIR tools</text>
    <text x="82" y="250" font-size="17" fill="#7dd3fc" letter-spacing="3">ACQUISITION  ·  ANALYSIS  ·  RESPONSE</text>
  </g>
</svg>
